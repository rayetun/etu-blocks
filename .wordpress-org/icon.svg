<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Etu Blocks">
  <title>Etu Blocks</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b74ff"/>
      <stop offset="0.55" stop-color="#635bff"/>
      <stop offset="1" stop-color="#4b45d6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1a1440" flood-opacity="0.28"/>
    </filter>
    <style>
      @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(0.93); } }
      @keyframes pulse   { 0%,100% { opacity: 1; } 50% { opacity: 0.72; } }
      @keyframes halo    { 0%,100% { opacity: 0.25; transform: scale(0.9); } 50% { opacity: 0.7; transform: scale(1.08); } }
      .blk { transform-box: fill-box; transform-origin: center; animation: breathe 3.2s ease-in-out infinite; }
      .b1 { animation-delay: 0s; }
      .b2 { animation-delay: 0.35s; }
      .b3 { animation-delay: 0.7s; }
      .b4 { animation-delay: 1.05s; }
      .accent { animation: pulse 2.4s ease-in-out infinite; }
      .halo { transform-box: fill-box; transform-origin: center; animation: halo 2.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .blk, .accent, .halo { animation: none; }
      }
    </style>
  </defs>

  <!-- Tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sheen)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Accent halo behind the live block -->
  <circle class="halo" cx="321" cy="321" r="120" fill="url(#glow)"/>

  <!-- Block cluster -->
  <g filter="url(#soft)">
    <rect class="blk b1" x="114" y="114" width="130" height="130" rx="34" fill="#ffffff" fill-opacity="0.95"/>
    <rect class="blk b2" x="268" y="114" width="130" height="130" rx="34" fill="#ffffff" fill-opacity="0.78"/>
    <rect class="blk b3" x="114" y="268" width="130" height="130" rx="34" fill="#ffffff" fill-opacity="0.78"/>
    <rect class="blk accent b4" x="268" y="268" width="130" height="130" rx="34" fill="#ffffff"/>
  </g>

  <!-- Interactivity spark on the accent block -->
  <circle class="accent" cx="333" cy="333" r="15" fill="#635bff"/>
</svg>
